{% extends 'news/base.html' %}
{% load static %}

{% block title %}Sign Out - Anime News Hub{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-container">
        <div class="auth-card" style="text-align: center;">
            <div class="auth-header">
                <div style="font-size: 3rem; margin-bottom: var(--space-4);">👋</div>
                <h1 class="auth-title">You've Been Signed Out</h1>
                <p class="auth-subtitle">Thanks for visiting Anime News Hub!</p>
            </div>

            <div style="display: flex; flex-direction: column; gap: var(--space-4);">
                <a href="{% url 'home' %}" class="btn btn--primary btn--full">
                    Return to Home
                </a>
                <a href="{% url 'account_login' %}" class="btn btn--secondary btn--full">
                    Sign In Again
                </a>
            </div>
        </div>
    </div>
</div>

<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    padding: var(--space-8) 0;
}

.auth-card {
    background: var(--gradient-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-2xl);
    padding: var(--space-10);
    width: 100%;
    max-width: 420px;
}

.auth-header {
    margin-bottom: var(--space-8);
}

.auth-title {
    font-family: var(--font-display);
    font-size: var(--text-2xl);
    font-weight: 700;
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: var(--space-2);
}

.auth-subtitle {
    color: var(--text-secondary);
    font-size: var(--text-sm);
}

.btn--full {
    width: 100%;
    padding: var(--space-4);
    font-size: var(--text-base);
    text-decoration: none;
}
</style>
{% endblock %}

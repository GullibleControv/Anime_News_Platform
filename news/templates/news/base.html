{% load static %}
<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: localStorage.getItem('theme') !== 'light' }" :class="{ 'light-theme': !darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Latest anime news, reviews, merchandise updates, and event coverage from around the world.{% endblock %}">
    <meta name="theme-color" content="#0d0d0f">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}Anime News Hub{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Your source for the latest anime news and updates{% endblock %}">
    <meta property="og:site_name" content="Anime News Hub">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">

    <title>{% block title %}Anime News Hub{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎌</text></svg>">

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{% static 'news/css/main.css' %}">

    {% block extra_css %}{% endblock %}

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
</head>
<body hx-boost="true">
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="visually-hidden">Skip to main content</a>

    {% include 'news/partials/_navbar.html' %}

    <main id="main-content" class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% include 'news/partials/_footer.html' %}

    <!-- Scroll to Top Button -->
    <div x-data="scrollToTop" x-show="visible" x-transition class="scroll-to-top">
        <button @click="scrollTop" class="btn btn--secondary" aria-label="Scroll to top">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 15l-6-6-6 6"/>
            </svg>
        </button>
    </div>

    <!-- Theme Toggle Button -->
    <div class="theme-toggle">
        <button @click="darkMode = !darkMode; localStorage.setItem('theme', darkMode ? 'dark' : 'light')"
                class="btn btn--ghost"
                :aria-label="darkMode ? 'Switch to light mode' : 'Switch to dark mode'"
                style="width: 44px; height: 44px; padding: 0; border-radius: var(--radius-full);">
            <!-- Moon icon (shown in dark mode) -->
            <svg x-show="darkMode" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <!-- Sun icon (shown in light mode) -->
            <svg x-show="!darkMode" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </button>
    </div>

    <!-- Main JavaScript -->
    <script src="{% static 'news/js/main.js' %}"></script>

    {% block extra_js %}{% endblock %}

    <style>
        .scroll-to-top {
            position: fixed;
            bottom: var(--space-6);
            right: var(--space-6);
            z-index: var(--z-sticky);
        }
        .scroll-to-top .btn {
            width: 48px;
            height: 48px;
            padding: 0;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-lg);
        }
        .theme-toggle {
            position: fixed;
            bottom: var(--space-6);
            left: var(--space-6);
            z-index: var(--z-sticky);
        }
        .theme-toggle .btn {
            box-shadow: var(--shadow-lg);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }
        .theme-toggle .btn:hover {
            border-color: var(--accent-primary);
        }
        /* Light theme overrides */
        .light-theme {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e9ecef;
            --text-primary: #212529;
            --text-secondary: #495057;
            --text-muted: #6c757d;
            --border-color: #dee2e6;
        }
    </style>
</body>
</html>

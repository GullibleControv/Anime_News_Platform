<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>{{ article.title }}</title>
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <a href="{% url 'home' %}" class="btn btn-outline-secondary mb-3"
            >&larr; Back to News</a
          >

          <div class="card shadow-lg">
            {% if article.image_url %}
            <img
              src="{{ article.image_url }}"
              class="card-img-top"
              alt="{{ article.title }}"
            />
            {% endif %}
            <div class="card-body p-5">
              <span class="badge bg-primary mb-2"
                >{{ article.get_category_display }}</span
              >

              <h1 class="card-title mb-4">{{ article.title }}</h1>
              <p class="text-muted">Published: {{ article.published_date }}</p>
              <hr />
              <p class="card-text lead">{{ article.content|linebreaks }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<nav class="navbar">
    <div class="navbar__container">
        <!-- Brand -->
        <a href="{% url 'home' %}" class="navbar__brand">
            <span class="navbar__logo">🎌</span>
            <span class="navbar__title">Anime News Hub</span>
        </a>

        <!-- Search -->
        <div class="navbar__search" x-data="searchComponent">
            <svg class="navbar__search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.35-4.35"/>
            </svg>
            <input
                type="search"
                name="q"
                class="navbar__search-input"
                placeholder="Search anime news... (press /)"
                autocomplete="off"
                x-ref="searchInput"
                hx-get="{% url 'search' %}"
                hx-trigger="input changed delay:300ms, search"
                hx-target="#search-results-dropdown"
                hx-indicator=".search-spinner"
                @keydown.escape="$el.blur()"
            >
            <span class="search-spinner htmx-indicator" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%);">
                <span class="spinner"></span>
            </span>

            <!-- Search Results Dropdown -->
            <div id="search-results-dropdown"
                 class="search-dropdown"
                 style="position: absolute; top: 100%; left: 0; right: 0; margin-top: 8px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); max-height: 400px; overflow-y: auto; display: none; z-index: var(--z-dropdown);">
            </div>
        </div>

        <!-- Actions -->
        <div class="navbar__actions">
            {% if user.is_authenticated %}
            <a href="{% url 'profile' %}" class="btn btn--ghost navbar__user">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
                My Bookmarks
            </a>
            <a href="{% url 'account_logout' %}" class="btn btn--ghost">
                Sign Out
            </a>
            {% else %}
            <a href="{% url 'account_login' %}" class="btn btn--ghost">
                Sign In
            </a>
            <a href="{% url 'account_signup' %}" class="btn btn--primary">
                Join Now
            </a>
            {% endif %}
        </div>
    </div>
</nav>

<script>
    // Show/hide search dropdown based on content
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === 'search-results-dropdown') {
            const dropdown = evt.detail.target;
            dropdown.style.display = dropdown.innerHTML.trim() ? 'block' : 'none';
        }
    });

    // Hide dropdown when clicking outside
    document.addEventListener('click', function(e) {
        const dropdown = document.getElementById('search-results-dropdown');
        const searchContainer = document.querySelector('.navbar__search');
        if (dropdown && searchContainer && !searchContainer.contains(e.target)) {
            dropdown.style.display = 'none';
        }
    });

    // Hide dropdown when input is cleared
    document.querySelector('.navbar__search-input')?.addEventListener('input', function(e) {
        if (!e.target.value.trim()) {
            document.getElementById('search-results-dropdown').style.display = 'none';
        }
    });
</script>

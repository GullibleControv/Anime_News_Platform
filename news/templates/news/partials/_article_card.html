<article class="card" x-data="lazyImage">
    <div class="card__image-wrapper">
        {% if article.image_url %}
        <div x-show="!loaded" class="skeleton skeleton-image"></div>
        <img
            src="{{ article.image_url }}"
            alt="{{ article.title }}"
            class="card__image"
            loading="lazy"
            x-show="loaded && !error"
            @load="onLoad"
            @error="onError"
            x-transition
        >
        <div x-show="error" class="card__image-placeholder" style="display: flex; align-items: center; justify-content: center; height: 100%; background: var(--bg-tertiary); color: var(--text-muted);">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
            </svg>
        </div>
        {% else %}
        <div class="card__image-placeholder" style="display: flex; align-items: center; justify-content: center; height: 100%; background: var(--bg-tertiary); color: var(--text-muted);">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
            </svg>
        </div>
        {% endif %}

        <div class="card__category">
            <span class="badge badge--{{ article.category|lower }}">
                {{ article.get_category_display }}
            </span>
        </div>
    </div>

    <div class="card__content">
        <h3 class="card__title">{{ article.title }}</h3>
        <p class="card__excerpt">{{ article.content|truncatewords:25 }}</p>
    </div>

    <div class="card__footer">
        <time class="card__date" datetime="{{ article.published_date|date:'Y-m-d' }}">
            {{ article.published_date|date:"M d, Y" }}
        </time>
        <a href="{% url 'detail' article.id %}"
           class="card__link"
           hx-get="{% url 'detail' article.id %}"
           hx-target="#main-content"
           hx-swap="innerHTML transition:true"
           hx-push-url="true">
            Read More
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14"/>
                <path d="m12 5 7 7-7 7"/>
            </svg>
        </a>
    </div>
</article>

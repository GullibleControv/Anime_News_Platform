# =================================================================
# PRODUCTION Docker Compose for Anime News Platform
# =================================================================
# Use this file when deploying to a real server
# 
# Usage: docker compose -f docker-compose.prod.yml up -d
# =================================================================

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: anime-news-db
    environment:
      POSTGRES_USER: ${DB_USER:-anime_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-anime_news}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-anime_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    # No ports exposed - only internal access

  # Django Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anime-news-web
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=postgresql://${DB_USER:-anime_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-anime_news}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # Nginx with SSL Support
  nginx:
    image: nginx:alpine
    container_name: anime-news-nginx
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: always
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Certbot for SSL certificates (Let's Encrypt)
  certbot:
    image: certbot/certbot
    container_name: anime-news-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  static_files:
  media_files:

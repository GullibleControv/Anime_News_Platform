# ============================================================
# Docker Compose for Anime News Platform
# ============================================================
# This file orchestrates multiple containers working together.
# 
# Services defined:
#   - db: PostgreSQL database
#   - web: Django application (your code)
#   - nginx: Web server / reverse proxy
#
# To start:   docker-compose up
# To stop:    docker-compose down
# To rebuild: docker-compose up --build
# ============================================================

version: '3.8'

services:
  # ----------------------------------------------------------
  # DATABASE: PostgreSQL
  # ----------------------------------------------------------
  # PostgreSQL is a powerful, production-ready database.
  # Much better than SQLite for real applications.
  #
  # Why PostgreSQL over SQLite?
  #   - Handles multiple connections (SQLite locks on writes)
  #   - Better performance with large datasets
  #   - Advanced features (JSON fields, full-text search)
  #   - Industry standard for production
  # ----------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: anime-news-db
    
    # Environment variables for PostgreSQL setup
    environment:
      POSTGRES_USER: anime_user
      POSTGRES_PASSWORD: anime_pass
      POSTGRES_DB: anime_news
    
    # Persist data even when container is removed
    # Without this, you'd lose all data on container restart!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    # Expose port for local development tools (optional)
    # Format: "host_port:container_port"
    ports:
      - "5434:5432"  # Use 5433 to avoid conflict with local PostgreSQL
    
    # Health check - Docker waits until DB is ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime_user -d anime_news"]
      interval: 5s
      timeout: 5s
      retries: 5
    
    # Restart policy
    restart: unless-stopped

  # ----------------------------------------------------------
  # WEB: Django Application
  # ----------------------------------------------------------
  # Your Django app running with Gunicorn.
  # Connects to PostgreSQL instead of SQLite.
  # ----------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anime-news-web
    
    # Environment variables for Django
    # These override the .env file settings
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-dev-key-change-in-production}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DATABASE_URL=postgresql://anime_user:anime_pass@db:5432/anime_news
    
    # Mount static files volume (shared with nginx)
    volumes:
      - static_files:/app/staticfiles
    
    # Expose port (internal, not to host)
    expose:
      - "8000"
    
    # Wait for database to be healthy before starting
    depends_on:
      db:
        condition: service_healthy
    
    # Restart policy
    restart: unless-stopped

  # ----------------------------------------------------------
  # NGINX: Web Server / Reverse Proxy
  # ----------------------------------------------------------
  # Nginx serves:
  #   - Static files (CSS, JS, images) directly
  #   - Proxies dynamic requests to Django
  #
  # Why use Nginx?
  #   - Much faster at serving static files
  #   - Can handle SSL/HTTPS termination
  #   - Load balancing (if you have multiple web containers)
  #   - Caching
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: anime-news-nginx
    
    # Mount configuration and static files
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
    
    # Expose to the host machine
    # This is the port users will access
    ports:
      - "8081:80"
    
    # Wait for web to be ready
    depends_on:
      - web
    
    # Restart policy
    restart: unless-stopped

# ----------------------------------------------------------
# VOLUMES
# ----------------------------------------------------------
# Named volumes persist data between container restarts.
# Docker manages these automatically.
#
# To see volumes: docker volume ls
# To inspect:     docker volume inspect anime_news_postgres_data
# To remove:      docker volume rm anime_news_postgres_data
# ----------------------------------------------------------
volumes:
  postgres_data:
    name: anime_news_postgres_data
  static_files:
    name: anime_news_static_files

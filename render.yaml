# =================================================================
# Render Blueprint - Anime News Platform
# =================================================================
# This file tells Render how to deploy your application
# Render reads this and automatically sets everything up
# =================================================================

databases:
  # PostgreSQL Database (Free tier)
  - name: anime-news-db
    databaseName: anime_news
    user: anime_user
    plan: free  # Free tier!

services:
  # Django Web Service
  - type: web
    name: anime-news-platform
    plan: free  # Free tier!
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      # Secret key - Render generates this automatically
      - key: SECRET_KEY
        generateValue: true
      # Debug off for production
      - key: DEBUG
        value: "False"
      # Allowed hosts - Render provides the hostname
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Database URL - automatically linked to the database above
      - key: DATABASE_URL
        fromDatabase:
          name: anime-news-db
          property: connectionString

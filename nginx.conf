# ============================================================
# Nginx Configuration for Anime News Platform
# ============================================================
# Nginx acts as a reverse proxy, sitting in front of Django.
#
# Request flow:
#   User → Nginx (port 80) → Django/Gunicorn (port 8000)
#
# Nginx handles:
#   - Static files (served directly, very fast)
#   - Proxying dynamic requests to Django
#   - (Optional) SSL/HTTPS termination
#   - (Optional) Rate limiting, caching
# ============================================================

# Upstream definition - where to send dynamic requests
upstream django {
    # "web" is the service name from docker-compose.yml
    # Docker's internal DNS resolves this to the web container
    server web:8000;
}

server {
    # Listen on port 80 (HTTP)
    listen 80;
    
    # Server name (domain)
    # Use 'localhost' for development, your domain for production
    server_name localhost;
    
    # Maximum upload size (for file uploads)
    client_max_body_size 10M;

    # ----------------------------------------------------------
    # STATIC FILES
    # ----------------------------------------------------------
    # Serve static files directly from Nginx (much faster than Django)
    # These are CSS, JavaScript, images, etc.
    #
    # alias: Maps the URL path to a filesystem path
    # expires: Browser caching duration
    # ----------------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        
        # Cache static files for 1 day
        expires 1d;
        
        # Add cache control header
        add_header Cache-Control "public, immutable";
        
        # Enable gzip compression for text files
        gzip on;
        gzip_types text/css application/javascript text/javascript;
    }

    # ----------------------------------------------------------
    # MEDIA FILES (User uploads, if you add them later)
    # ----------------------------------------------------------
    # location /media/ {
    #     alias /app/media/;
    #     expires 7d;
    # }

    # ----------------------------------------------------------
    # DYNAMIC REQUESTS (Everything else goes to Django)
    # ----------------------------------------------------------
    location / {
        # Pass request to Django
        proxy_pass http://django;
        
        # Preserve original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ----------------------------------------------------------
    # HEALTH CHECK ENDPOINT
    # ----------------------------------------------------------
    # Simple endpoint for load balancers/monitoring
    location /health {
        access_log off;  # Don't log health checks
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
